name: Release to Azure

on:
  workflow_dispatch:
    inputs:
      deployProduction:
        description: Promote to production only after reviewing staging
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: azure-release
  cancel-in-progress: false

jobs:
  test:
    if: vars.ENABLE_AZURE_DEPLOYMENT == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/EventWall.Web/package-lock.json
      - name: Test API
        run: dotnet test EventWall.slnx --configuration Release
      - name: Test web app
        run: |
          npm ci --prefix src/EventWall.Web
          npm test --prefix src/EventWall.Web

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    strategy:
      matrix:
        role: [public, admin, submission]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/EventWall.Web/package-lock.json
      - name: Build isolated web app
        if: matrix.role != 'submission'
        env:
          VITE_SITE_ROLE: ${{ matrix.role }}
        run: |
          npm ci --prefix src/EventWall.Web
          npm run build --prefix src/EventWall.Web
          node tools/demo/verify-build.mjs "${{ matrix.role }}" src/EventWall.Web/dist
          rm -rf src/EventWall.Api/wwwroot/assets
          mkdir -p src/EventWall.Api/wwwroot
          cp -R src/EventWall.Web/dist/. src/EventWall.Api/wwwroot/
      - name: Publish API package
        run: |
          dotnet publish src/EventWall.Api --configuration Release --output publish -p:EventWallSiteRole=${{ matrix.role }}
          if [ "${{ matrix.role }}" = "submission" ]; then
            node --test tools/demo/questions-client.test.mjs
            node tools/demo/verify-build.mjs submission publish/wwwroot
          fi
          cd publish
          zip -r ../eventwall-${{ matrix.role }}.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eventwall-${{ matrix.role }}
          path: eventwall-${{ matrix.role }}.zip
          if-no-files-found: error
          retention-days: 30

  staging:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eventwall-*
          merge-multiple: true
      - name: Authenticate to configure the submission site
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure the staging submission site
        run: |
          az webapp config set --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_SUBMISSION_STAGING }}" --web-sockets-enabled true --always-on true --output none
          az webapp update --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_SUBMISSION_STAGING }}" --client-affinity-enabled true --output none
      - name: Authenticate for the admin deployment
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy admin to staging
        run: az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_ADMIN_STAGING }}" --src-path eventwall-admin.zip --type zip --clean true --timeout 600000
      - name: Authenticate for the wall deployment
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy wall to staging
        run: az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_STAGING }}" --src-path eventwall-public.zip --type zip --clean true --timeout 600000
      - name: Authenticate for the submission deployment
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy submission to staging
        run: az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_SUBMISSION_STAGING }}" --src-path eventwall-submission.zip --type zip --clean true --timeout 600000
      - name: Verify anonymous staging roles
        run: |
          curl --fail --retry 5 --retry-delay 10 "https://${{ vars.AZURE_WEBAPP_STAGING }}.azurewebsites.net/api/health"
          curl --fail --retry 5 --retry-delay 10 "https://${{ vars.AZURE_WEBAPP_SUBMISSION_STAGING }}.azurewebsites.net/api/public/submission-config" --output /dev/null

  production:
    if: ${{ inputs.deployProduction }}
    runs-on: ubuntu-latest
    needs: staging
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: production
    steps:
      - name: Require a protected production approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/environments/production" --jq '.protection_rules | any(.type == "required_reviewers")' | grep -qx true || {
            echo "::error::Configure required reviewers for the production environment before promotion."
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: eventwall-*
          merge-multiple: true
      - name: Authenticate to configure the submission site
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure the production submission site
        run: |
          az webapp config set --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_SUBMISSION_PRODUCTION }}" --web-sockets-enabled true --always-on true --output none
          az webapp update --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_SUBMISSION_PRODUCTION }}" --client-affinity-enabled true --output none
      - name: Authenticate for the admin deployment
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy admin to production
        run: az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_ADMIN_PRODUCTION }}" --src-path eventwall-admin.zip --type zip --clean true --timeout 600000
      - name: Authenticate for the wall deployment
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy wall to production
        run: az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_PRODUCTION }}" --src-path eventwall-public.zip --type zip --clean true --timeout 600000
      - name: Authenticate for the submission deployment
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy submission to production
        run: az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_SUBMISSION_PRODUCTION }}" --src-path eventwall-submission.zip --type zip --clean true --timeout 600000
